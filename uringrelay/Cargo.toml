[package]
name = "uringrelay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bpaf = { version = "0.9.22", features = ["derive"] }
io-uring = { git = "https://github.com/asayers/io-uring.git", branch = "entry-result", version = "0.7.11" }
libc = "0.2.180"
rustix = { version = "1.1.3", features = ["fs", "net", "pipe"] }
slab = "0.4.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wsclient = { version = "0.1.0", path = "../wsclient" }
wsserver = { version = "0.1.0", path = "../wsserver" }
